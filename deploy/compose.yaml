# DUyka PARIS — déployé dans /home/evg/ivan/gamble/ (derrière Nginx Proxy Manager)
# Aucun port publié sur l'hôte : NPM joint le conteneur par son nom sur le réseau npm_default
# (hôte proxy : http://gamble:3001).
services:
  gamble:
    build:
      context: ./src
      args:
        BASE_PATH: /paris      # provisoire : servi sous poker.dyuka.com/paris/ (vide = racine d'un domaine dédié)
    image: gamble:local
    container_name: gamble
    restart: unless-stopped
    init: true                 # PID 1 propre : Node seul ignorerait SIGTERM (arrêt lent, puis SIGKILL)
    environment:
      NODE_ENV: production
      DB_PATH: /donnees/oddsroom.sqlite
      BASE_PATH: /paris        # doit être identique à l'argument de build ci-dessus
      BANQUE_URL: http://poker:8497   # mode banque (jetons communs) : actif seulement si BANQUE_SECRET est aussi défini
    env_file:
      - path: ./gamble.env     # VAPID_* / INITIAL_INVITE_CODE / BANQUE_SECRET (0600, hors dépôt)
        required: false
    volumes:
      - ./donnees:/donnees
    networks: [npm_default]
    mem_limit: 384m
    pids_limit: 256

networks:
  npm_default:
    external: true
